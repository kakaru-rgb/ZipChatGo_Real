spring.application.name=zipchatgo
spring.config.import=optional:file:.env[.properties]

# Thymeleaf 캐시 끄기 (저장 후 F5 새로고침 시 즉시 반영)
spring.thymeleaf.cache=false

# 정적 리소스(CSS, JS) 캐시 끄기
spring.web.resources.cache.period=0

# DevTools 재시작 및 LiveReload
spring.devtools.restart.enabled=true

# LiveReload 서버 활성화
spring.devtools.livereload.enabled=true



server.port=${PORT:8080}

# AI Server
ai.server.base-url=${AI_SERVER_URL:${AI_SERVER_BASE_URL:http://localhost:8000}}
internal.api-key=${INTERNAL_API_KEY:}

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:zipchatgo}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never

molit.service-key=${MOLIT_SERVICE_KEY:}
molit.default-region=${DEFAULT_LAWD_CD:41117}
molit.apt-trade-url=${MOLIT_APT_TRADE_URL:https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade}
molit.apt-rent-url=${MOLIT_APT_RENT_URL:https://apis.data.go.kr/1613000/RTMSDataSvcAptRent/getRTMSDataSvcAptRent}

naver.maps.client-key=${NAVER_MAPS_CLIENT_KEY:}

supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:}

# 사진 업로드 용량 설정
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
