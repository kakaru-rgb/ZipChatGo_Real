spring.application.name=zipchatgo

# Thymeleaf 캐시 끄기 (저장 후 F5 새로고침 시 즉시 반영)
spring.thymeleaf.cache=false

# 정적 리소스(CSS, JS) 캐시 끄기
spring.web.resources.cache.period=0

# DevTools 재시작 및 LiveReload
spring.devtools.restart.enabled=true

# LiveReload 서버 활성화
spring.devtools.livereload.enabled=true



server.port=${PORT:8080}

ai.server.base-url=${AI_SERVER_BASE_URL:http://127.0.0.1:8000}

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:4000}/${DB_DATABASE:housepick}?sslMode=VERIFY_IDENTITY&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

molit.service-key=${MOLIT_SERVICE_KEY:}
molit.default-region=${DEFAULT_LAWD_CD:41117}
molit.apt-trade-url=${MOLIT_APT_TRADE_URL:https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade}
molit.apt-rent-url=${MOLIT_APT_RENT_URL:https://apis.data.go.kr/1613000/RTMSDataSvcAptRent/getRTMSDataSvcAptRent}
